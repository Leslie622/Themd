name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: website
        run: npm ci --include=optional
      # Windows 上生成的 lockfile 在 Linux 可能缺 rollup 原生可选依赖,缺了就补装
      - name: Ensure Linux rollup native binary
        if: runner.os == 'Linux'
        working-directory: website
        run: npm ls @rollup/rollup-linux-x64-gnu --depth=0 2>/dev/null || npm i --no-save @rollup/rollup-linux-x64-gnu
      - name: Type check
        working-directory: website
        run: |
          npx tsc -b --pretty false 2>&1 | tee /tmp/tsc.log
          EXIT=${PIPESTATUS[0]}
          # 把错误行转成 GitHub 注解,便于匿名 API 排查
          grep -E "error TS" /tmp/tsc.log | sed 's/^/::error /' || true
          exit $EXIT
      - name: Build
        working-directory: website
        run: |
          npx vite build 2>&1 | tee /tmp/vite.log
          EXIT=${PIPESTATUS[0]}
          grep -iE "^error|Error:|ERROR" /tmp/vite.log | sed 's/^/::error /' || true
          exit $EXIT
      # 排查用:失败时把日志推到 ci-log-dump 分支,raw 匿名可读
      - name: Dump logs
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git fetch origin ci-log-dump 2>/dev/null || true
          git checkout -B ci-log-dump
          cp /tmp/vite.log build-vite.log 2>/dev/null || true
          cp /tmp/tsc.log build-tsc.log 2>/dev/null || true
          cp /tmp/npm*.log build-npm.log 2>/dev/null || true
          git add -f build-*.log 2>/dev/null || true
          git commit -m "ci log dump run ${{ github.run_id }}" || true
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} ci-log-dump --force
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
