name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: website
        run: npm ci --include=optional
      # Windows 上生成的 lockfile 在 Linux 可能缺 rollup 原生可选依赖,缺了就补装
      - name: Ensure Linux rollup native binary
        if: runner.os == 'Linux'
        working-directory: website
        run: npm ls @rollup/rollup-linux-x64-gnu --depth=0 2>/dev/null || npm i --no-save @rollup/rollup-linux-x64-gnu
      - name: Type check
        working-directory: website
        run: npx tsc -b --pretty false
      - name: Build
        working-directory: website
        run: npx vite build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
