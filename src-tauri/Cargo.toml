[package]
name = "themd"
version = "0.1.0"
description = "Themd — 样式自设的本地 Markdown 笔记本"
edition = "2021"

# Tauri v2 对应的 crates
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
# 图床上传:前端 fetch 由 Rust 层代理发出,绕开 WebView CORS 限制,
# 任意服务商与本地 PicGo 端口均可直连
tauri-plugin-http = "2"
# 文件绑定双向同步:监听绑定笔记的外部改动(notify 经 debouncer 再导出,
# 统一用 notify_debouncer_full::notify 路径引用,避免双版本 notify 类型冲突)
notify-debouncer-full = "0.6"

# 导出 PDF:走 WebView2 的 PrintToPdf COM 接口(ICoreWebView2_7),
# 版本须与 wry 所用的 webview2-com/windows 对齐,避免接口重复注册
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }

[profile.dev]
incremental = true # 首次编译后增量编译更快

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # 体积优先(桌面笔记应用不需要极致运行速度)
strip = true
